services:
 app-01:
    image: a7med421/hit-counter:1.1.0
    container_name: app-01
    networks:
      - internal-net
    restart: unless-stopped
    environment:
      - APP_INSTANCE_NAME=app-01

 app-02:
    image: a7med421/hit-counter:1.1.0
    container_name: app-02
    networks:
      - internal-net
    restart: unless-stopped
    environment:
      - APP_INSTANCE_NAME=app-02

 app-03:
    image: a7med421/hit-counter:1.1.0
    container_name: app-03
    networks:
      - internal-net
    restart: unless-stopped
    environment:
      - APP_INSTANCE_NAME=app-03

 nginx-01:
    image: nginx:alpine
    container_name: internal-nginx-01
    restart: unless-stopped
    volumes:
      - ./nginx/nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
    depends_on:
      - app-01
      - app-02
      - app-03
    networks:
      - internal-net
      - public-net
   # ports:
   #   - "8080:80"

 nginx-02:
    image: nginx:alpine
    container_name: internal-nginx-02
    restart: unless-stopped
    volumes:
      - ./nginx/nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
    depends_on:
      - app-01
      - app-02
      - app-03
    networks:
      - internal-net
      - public-net
   # ports:
   #   - "8081:80"

 haproxy-lb-01:
    image: haproxy:alpine
    container_name: haproxy-lb-01
    restart: unless-stopped
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - nginx-01
      - nginx-02
    networks:
      - public-net
    ports:
      - "8080:80"

networks:
  internal-net:
    driver: bridge
    internal: true
  public-net:
    driver: bridge
