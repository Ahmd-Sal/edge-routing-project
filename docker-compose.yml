services:
  app-01:
    image: a7med421/hit-counter:1.1.0
    container_name: app-01
    networks:
      - internal-net
    restart: unless-stopped
    environment:
      - APP_INSTANCE_NAME=app-01

  app-02:
    image: a7med421/hit-counter:1.1.0
    container_name: app-02
    networks:
      - internal-net
    restart: unless-stopped
    environment:
      - APP_INSTANCE_NAME=app-02

  app-03:
    image: a7med421/hit-counter:1.1.0
    container_name: app-03
    networks:
      - internal-net
    restart: unless-stopped
    environment:
      - APP_INSTANCE_NAME=app-03

  nginx-01:
    image: nginx:alpine
    container_name: internal-nginx-01
    restart: unless-stopped
    volumes:
      - ./nginx/nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
    depends_on:
      - app-01
      - app-02
      - app-03
    networks:
      - internal-net
      - public-net
    # ports:
    #   - "8080:80"

  nginx-02:
    image: nginx:alpine
    container_name: internal-nginx-02
    restart: unless-stopped
    volumes:
      - ./nginx/nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
    depends_on:
      - app-01
      - app-02
      - app-03
    networks:
      - internal-net
      - public-net
    # ports:
    #   - "8081:80"

  haproxy-lb-01:
    image: haproxy:alpine
    container_name: haproxy-lb-01
    restart: unless-stopped
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - nginx-01
      - nginx-02
    networks:
      - public-net
    ports:
      - "8080:80"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    depends_on:
      - haproxy-lb-01
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cadvisor
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - monitoring-net

networks:
  internal-net:
    driver: bridge
    internal: true
  monitoring-net:
    driver: bridge
    internal: true
  public-net:
    driver: bridge
