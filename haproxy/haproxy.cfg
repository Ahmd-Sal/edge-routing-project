global
  log stdout format raw local0

defaults
  log global
  option httplog
  option dontlognull

frontend http
  mode http
  bind *:80
  timeout client 5s  
  http-request deny if { path -i -m beg /health }
  default_backend nginx_proxies

frontend stats
    mode http
    bind *:8404
    acl internal_network src 172.16.0.0/12 127.0.0.1
    http-request deny if { path /metrics } !internal_network
    http-request use-service prometheus-exporter if { path /metrics }
    no log

backend nginx_proxies
  mode http
  balance roundrobin
  timeout connect 3s
  timeout server 3s
  option httpchk GET /health
  http-check expect status 200

  server nginx-01 internal-nginx-01:80 check inter 2s fall 3 rise 2
  server nginx-02 internal-nginx-02:80 check inter 2s fall 3 rise 2 
