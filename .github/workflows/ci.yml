name: Run Code Tests

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  # Detect Changes First
  filter:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      go_files: ${{ steps.filter.outputs.go_files }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go_files:
              - 'backend/go-api/**'

  run-tests:
    runs-on: ubuntu-24.04
    needs: filter
    if: ${{ needs.filter.outputs.go_files == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Test & Lint Go Code -- ONLY TRIGGERS IF CODE CHANGES
      - name: Setup Go and test the newly made changes
        if: needs.filter.outputs.go_files == 'true'
        uses: ./.github/actions/setup-and-test-go
