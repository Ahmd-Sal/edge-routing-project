name: Production Deployment

on:
  push:
    tags:
      - "**@[0-9]*.[0-9]*.[0-9]*" # service/foo/bar@X.Y.Z
  # I made it so it builds and pushes on each release-please merge, even if the backend/go-api files was not changed. To ensure ease of troubleshooting if a problem occures

jobs:
  deploy:
    name: Push to registry
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse Git Tag
        id: parse-tag
        shell: bash
        run: |
          ref_tag="${{ github.ref_name }}"
          echo "Processing tag: $ref_tag"

          version="${ref_tag#*@}"    # Result: 1.2.3

          echo "Extracted Version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend/go-api
          push: ${{ !env.ACT }} # Don't push images when running locally
          tags: ${{ vars.DOCKER_USERNAME }}/hit-counter:${{ steps.parse-tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Deploy
        if: ${{ !env.ACT }} # Don't trigger deploy when running locally
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update-compose-yaml.yml \
            -f version=${{ steps.parse-tag.outputs.version }} 
